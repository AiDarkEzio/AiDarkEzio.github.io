    <script>
        // Mobile Menu Toggle Script
        const mobileMenuButtonProjects = document.getElementById('mobile-menu-button');
        const mobileMenuProjects = document.getElementById('mobile-menu');
        const menuIconProjects = mobileMenuButtonProjects.querySelector('i');

        mobileMenuButtonProjects.addEventListener('click', (event) => {
            event.stopPropagation();
            mobileMenuProjects.classList.toggle('hidden');
            if (mobileMenuProjects.classList.contains('hidden')) {
                menuIconProjects.classList.remove('fa-times');
                menuIconProjects.classList.add('fa-bars');
            } else {
                menuIconProjects.classList.remove('fa-bars');
                menuIconProjects.classList.add('fa-times');
            }
        });

        document.addEventListener('click', function(event) {
            const isClickInsideNav = mobileMenuButtonProjects.contains(event.target) || mobileMenuProjects.contains(event.target);
            if (!isClickInsideNav && !mobileMenuProjects.classList.contains('hidden')) {
                mobileMenuProjects.classList.add('hidden');
                menuIconProjects.classList.remove('fa-times');
                menuIconProjects.classList.add('fa-bars');
            }
        });
    </script>

    <script>
        const githubUsername = 'aidarkezio';
        const projectsContainer = document.getElementById('projects-container');
        const loadingMessage = document.getElementById('loading-message');

        // Helper function to format relative date
        function formatRelativeDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            if (diffInSeconds < 60) return 'Just now';
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
            if (diffInSeconds < 2592000) return `${Math.floor(diffInSeconds / 86400)}d ago`;
            
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Helper function to render a single Masonry project card
        function renderProjectCard(repo) {
            const card = document.createElement('div');
            // 'break-inside-avoid mb-6 inline-block w-full' ensures smooth Masonry column behavior
            card.className = 'glass-card glass-card-hover p-6 flex flex-col justify-between hover-effect break-inside-avoid mb-6 inline-block w-full';

            const topicsHtml = (repo.topics && repo.topics.length > 0)
                ? `<div class="flex flex-wrap gap-1.5 pt-2">
                    ${repo.topics.map(topic => `
                        <span class="text-[11px] bg-black-base/60 text-neutral-gray border border-border-glass px-2 py-0.5 rounded-md">
                            #${topic}
                        </span>
                    `).join('')}
                   </div>`
                : '';

            const languageHtml = repo.language
                ? `<div class="inline-flex items-center text-xs font-medium text-vibrant-teal bg-vibrant-teal/10 border border-vibrant-teal/20 px-2.5 py-1 rounded-md">
                    <i class="fas fa-code text-[10px] mr-1.5"></i>${repo.language}
                   </div>`
                : '';

            const archivedBadgeHtml = repo.archived
                ? `<span class="text-xs font-medium bg-transparent-red-hint text-red-300 px-2 py-0.5 rounded-full border border-red-500/20 shrink-0">
                    <i class="fas fa-box-archive text-[10px] mr-1"></i>Archived
                   </span>`
                : '';

            const demoButtonHtml = (repo.homepage && repo.homepage.trim() !== '')
                ? `<a href="${repo.homepage}" target="_blank" rel="noopener noreferrer"
                      class="inline-flex items-center text-xs font-semibold px-3 py-1.5 rounded-full bg-vibrant-teal text-black-base hover:bg-vibrant-blue hover:text-light-text transition-all duration-300 shadow-sm">
                    <i class="fas fa-external-link-alt mr-1.5"></i>Live Demo
                   </a>`
                : '';

            card.innerHTML = `
                <div>
                    <!-- Card Top Header -->
                    <div class="flex items-start justify-between mb-3 gap-2">
                        <h3 class="font-bold text-xl text-light-text break-words">
                            <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="hover:text-vibrant-teal transition-colors duration-200">
                                ${repo.name}
                            </a>
                        </h3>
                        ${archivedBadgeHtml}
                    </div>

                    <!-- Description -->
                    <p class="text-medium-text text-sm leading-relaxed mb-4">
                        ${repo.description || 'No description provided.'}
                    </p>

                    <!-- Language & Topics -->
                    <div class="mb-4 space-y-2">
                        ${languageHtml}
                        ${topicsHtml}
                    </div>
                </div>

                <!-- Card Footer & Actions -->
                <div class="pt-4 border-t border-border-glass mt-2">
                    <div class="flex items-center justify-between text-xs text-neutral-gray mb-4">
                        <div class="flex items-center space-x-3">
                            <span title="Stars" class="flex items-center">
                                <i class="fas fa-star text-yellow-400/90 mr-1 text-[11px]"></i>${repo.stargazers_count || 0}
                            </span>
                            <span title="Forks" class="flex items-center">
                                <i class="fas fa-code-branch text-neutral-gray mr-1 text-[11px]"></i>${repo.forks_count || 0}
                            </span>
                        </div>
                        <div title="Last Updated" class="flex items-center">
                            <i class="far fa-clock mr-1 text-[11px]"></i>${formatRelativeDate(repo.pushed_at || repo.updated_at)}
                        </div>
                    </div>

                    <div class="flex items-center justify-end space-x-2">
                        ${demoButtonHtml}
                        <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer"
                           class="inline-flex items-center text-xs font-medium px-3 py-1.5 rounded-full border border-border-glass bg-black-base/50 text-light-text hover:border-vibrant-teal hover:text-vibrant-teal hover:bg-black-base transition-all duration-300">
                            <i class="fab fa-github mr-1.5 text-sm"></i>Code
                        </a>
                    </div>
                </div>
            `;

            return card;
        }

        async function fetchGitHubProjects() {
            let allProjects = [];
            let nextPageUrl = `https://api.github.com/users/${githubUsername}/repos?sort=updated&direction=desc&per_page=100`;

            try {
                while (nextPageUrl) {
                    const response = await fetch(nextPageUrl);
                    if (!response.ok) throw new Error(`GitHub API HTTP status ${response.status}`);

                    const projects = await response.json();
                    allProjects = allProjects.concat(projects);

                    // Handle GitHub API Pagination Link header
                    const linkHeader = response.headers.get('Link');
                    nextPageUrl = null;
                    if (linkHeader) {
                        const links = linkHeader.split(',');
                        const nextLink = links.find(link => link.includes('rel="next"'));
                        if (nextLink) {
                            const urlMatch = nextLink.match(/<([^>]+)>/);
                            if (urlMatch) nextPageUrl = urlMatch[1];
                        }
                    }
                }

                // Filter out forked repositories
                const originalProjects = allProjects.filter(project => !project.fork);

                loadingMessage.style.display = 'none';
                projectsContainer.classList.remove('hidden');

                if (originalProjects.length === 0) {
                    projectsContainer.className = "w-full text-center text-medium-text py-8";
                    projectsContainer.innerHTML = '<p>No public projects found.</p>';
                    return;
                }

                projectsContainer.innerHTML = '';
                originalProjects.forEach(project => {
                    const cardElement = renderProjectCard(project);
                    projectsContainer.appendChild(cardElement);
                });

            } catch (error) {
                loadingMessage.style.display = 'none';
                projectsContainer.classList.remove('hidden');
                projectsContainer.className = "w-full text-center text-medium-text text-lg p-8";
                projectsContainer.innerHTML = `
                    <div class="text-center text-medium-text text-lg p-8">
                        <p class="text-red-400 mb-3 font-semibold"><i class="fas fa-exclamation-triangle mr-2"></i>Error loading projects from GitHub.</p>
                        <p>Please try again later or view them directly on <a class="font-bold text-vibrant-teal hover:underline" href="https://github.com/${githubUsername}" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>
                    </div>
                `;
                console.error('Error fetching GitHub projects:', error);
            }
        }

        fetchGitHubProjects();
    </script>
